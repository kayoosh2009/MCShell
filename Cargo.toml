[package]
name = "mcshell"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
crossterm = "=0.27.0"
md-5 = "=0.10.6"
ratatui = { version = "=0.26.3", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
image = "0.25" 
base64 = "=0.21.7"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true