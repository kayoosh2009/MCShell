[package]
name = "mcshell"
version = "1.0.17"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
md-5 = "=0.10.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1.9", default-features = false, features = ["compat-1-2", "backend-winit", "renderer-femtovg", "std"] }
ureq = { version = "2", features = ["json"] }
image = "0.25" 
base64 = "=0.21.7"
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
slint-build = "1.9"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true