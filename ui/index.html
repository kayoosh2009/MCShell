<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minecraft Launcher</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <div class="banner">
      <img src="img/banner.png" alt="Minecraft Launcher" />
    </div>

    <div class="controls">
      <div class="field">
        <label for="nickname">Nickname</label>
        <input type="text" id="nickname" placeholder="Steve" value="Steve" />
      </div>

      <div class="field">
        <label for="version">Version</label>
        <input type="text" id="version" placeholder="1.20.1" value="1.20.1" />
      </div>

      <div class="spacer"></div>

      <button id="settings-btn" class="icon-btn" title="Settings">
        <img src="img/settings.png" alt="Settings" />
      </button>

      <button id="launch-btn" class="play-btn">
        <img src="img/play.png" alt="Play" />
        <span>Play</span>
      </button>
    </div>

    <div id="status" class="status"></div>
  </div>

  <script>
    const { invoke } = window.__TAURI__.core;

    document.getElementById('settings-btn').addEventListener('click', () => {
      // TODO: open settings window here later
      console.log('Settings clicked');
    });

    document.getElementById('launch-btn').addEventListener('click', async () => {
      const nickname = document.getElementById('nickname').value;
      const version = document.getElementById('version').value;
      const statusEl = document.getElementById('status');

      statusEl.textContent = 'Launching...';
      statusEl.className = 'status';

      const gameDir = '~/.minecraft';
      const javaPath = 'java';

      try {
        const response = await invoke('launch_game', {
          nickname,
          version,
          gameDir,
          javaPath
        });
        statusEl.textContent = response;
        statusEl.classList.add('success');
      } catch (err) {
        statusEl.textContent = err;
        statusEl.classList.add('error');
      }
    });
  </script>
</body>
</html>
