<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCShell Dashboard</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Левая часть: Профиль и скин -->
        <main class="content-panel">
            <div class="card profile-card">
                <h2>Профиль игрока</h2>
                
                <div class="user-info">
                    <label for="username">Игровой никнейм</label>
                    <div class="input-group">
                        <input type="text" id="username" placeholder="Player" autocomplete="off">
                        <button id="save-username-btn" class="btn btn-secondary">Сохранить</button>
                    </div>
                </div>

                <div class="skin-section">
                    <h3>Скин</h3>
                    <div class="skin-preview-box">
                        <div id="skin-preview-container">
                            <span class="placeholder-text">Превью скина</span>
                        </div>
                    </div>
                    
                    <div class="skin-actions">
                        <label class="btn btn-primary file-label">
                            Выбрать скин (.png)
                            <input type="file" id="skin-file-input" accept=".png" hidden>
                        </label>
                    </div>
                </div>
            </div>
        </main>

        <!-- Правая часть: Навигация -->
        <aside class="sidebar-nav">
            <div class="nav-header">
                <span class="logo">MCShell</span>
            </div>
            <nav class="nav-buttons">
                <button class="nav-btn active" data-page="profile">Профиль</button>
                <button class="nav-btn" data-page="settings">Настройки</button>
                <button class="nav-btn" data-page="mods">Моды & Паки</button>
                <button class="nav-btn" data-page="versions">Версии</button>
            </nav>
            <div class="nav-footer">
                <span id="connection-status">● Подключено (127.0.0.1)</span>
            </div>
        </aside>
    </div>

    <script src="/script.js"></script>
</body>
</html>
