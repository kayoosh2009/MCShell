<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MCShell browser</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>&gt; MCShell browser<span id="kind"></span></h1>
    <div id="info">loading...</div>

    <form id="form">
      <input id="q" placeholder="search..." autocomplete="off" autofocus>
      <button>search</button>
    </form>

    <div id="tags"></div>
    <div id="msg"></div>
    <div id="list"></div>
  </main>

  <div id="overlay" class="overlay hidden">
    <div class="modal" id="modal"></div>
  </div>

  <script src="/script.js"></script>
</body>
</html>
